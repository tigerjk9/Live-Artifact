name: Daily News Update

on:
  schedule:
    - cron: '30 0 * * *'   # 09:30 KST 1차 시도
    - cron: '0 1 * * *'    # 10:00 KST 2차 시도
    - cron: '30 1 * * *'   # 10:30 KST 3차 시도
  workflow_dispatch:        # 수동 실행 허용

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 이 스텝은 불리언 계산 전용이며 실행을 막아서는 안 된다. 어떤 이유로든 죽으면
      # skip 출력이 비어 `skip != 'true'`가 참이 되므로 생성 단계가 그대로 진행된다
      # (판정 불가 → 작업 수행 쪽으로 폴백). 2026-07-29~31 전면 중단 재발 방지.
      - name: Check if today already updated
        id: check
        continue-on-error: true
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          ARCHIVE="docs/archive/${TODAY}.html"
          echo "today=${TODAY}" >> $GITHUB_OUTPUT
          # 건수만 보면 안 된다: 수집기 Gemini가 죽으면 건수는 정상인데 카드가
          # 제목만 남는다. 그 상태로 skip하면 하루 종일 그대로 고착되므로,
          # 한국어 AI 요약 커버리지도 함께 게이트에 넣어 이후 cron이 재시도하게 한다.
          # `|| true` 필수: grep은 매칭 0건이면 exit 1이고 이 스텝은 bash -e로 돈다.
          # 아카이브가 아직 없는 날(=반드시 생성해야 하는 날)이 바로 그 경우라,
          # 없으면 스텝이 죽고 이후 생성 단계가 전부 skip돼 영구 고착된다.
          COV=$(grep -o 'name="ai-summary-coverage" content="[0-9]*/[0-9]*"' "$ARCHIVE" 2>/dev/null | head -1 | grep -o '[0-9]*/[0-9]*' || true)
          PCT=0
          if [ -n "$COV" ] && [ "${COV#*/}" -gt 0 ]; then
            PCT=$(( ${COV%/*} * 100 / ${COV#*/} ))
          fi
          if [ -f "$ARCHIVE" ] && grep -q 'class="entry"' "$ARCHIVE" && ! grep -q 'col-count">0건' "$ARCHIVE" && [ "$PCT" -ge 60 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[SKIP] ${TODAY} 아카이브 이미 완료 (AI 요약 ${COV:-?} = ${PCT}%) — 이후 단계 건너뜀"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "[RUN] ${TODAY} 데이터 생성 시작 (기존 AI 요약 ${COV:-없음} = ${PCT}%)"
          fi

      - name: Set up Python 3.11
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install requests python-dateutil

      - name: Fetch news and generate HTML
        if: steps.check.outputs.skip != 'true'
        env:
          NEWS_TOKEN: ${{ secrets.NEWS_GITHUB_TOKEN }}
        run: python scripts/fetch_and_generate.py

      - name: Validate article counts
        if: steps.check.outputs.skip != 'true'
        run: |
          # check 스텝이 죽었으면 출력이 비므로 여기서 다시 계산한다.
          TODAY="${{ steps.check.outputs.today }}"
          [ -n "$TODAY" ] || TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          ARCHIVE="docs/archive/${TODAY}.html"
          # 리포트 전용 단계 — grep 매칭 0건으로 bash -e가 죽어서 커밋 성공한 실행을
          # failure로 뒤집지 않도록 모든 추출에 `|| true`를 건다.
          if [ -f "$ARCHIVE" ]; then
            EDU=$(grep -o 'col-count">[^<]*건' "$ARCHIVE" | sed -n '1p' | grep -o '[0-9]*' || true)
            PAPER=$(grep -o 'col-count">[^<]*건' "$ARCHIVE" | sed -n '2p' | grep -o '[0-9]*' || true)
            TECH=$(grep -o 'col-count">[^<]*건' "$ARCHIVE" | sed -n '3p' | grep -o '[0-9]*' || true)
            echo "[RESULT] 교육뉴스=${EDU}건 / AI논문=${PAPER}건 / AI기술=${TECH}건"
            if [ "${EDU:-0}" -eq 0 ] || [ "${PAPER:-0}" -eq 0 ] || [ "${TECH:-0}" -eq 0 ]; then
              echo "::warning::섹션 중 0건이 있습니다 — 다음 실행에서 재시도됩니다 (교육=${EDU} 논문=${PAPER} 기술=${TECH})"
            fi
            COV=$(grep -o 'name="ai-summary-coverage" content="[0-9]*/[0-9]*"' "$ARCHIVE" | head -1 | grep -o '[0-9]*/[0-9]*' || true)
            if [ -n "$COV" ] && [ "${COV#*/}" -gt 0 ]; then
              PCT=$(( ${COV%/*} * 100 / ${COV#*/} ))
              echo "[RESULT] 한국어 AI 요약 커버리지=${COV} (${PCT}%)"
              if [ "$PCT" -lt 60 ]; then
                echo "::warning::AI 요약 커버리지 ${PCT}% — 소스 수집기의 Gemini 호출을 확인하세요 (스펜드 캡/쿼터/모델 폐기). 3개 수집기 Actions 로그에서 429·404를 검색하세요."
              fi
            fi
          fi

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || \
            git commit -m "chore: daily news update $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      # Pages 배포가 일시 장애로 실패/멈춤(building 고착)해도 레포 상태만 보는 skip 로직은
      # 재배포를 못 하므로, 최신 커밋이 실제 배포됐는지 확인하고 아니면 재빌드를 요청한다.
      - name: Verify Pages deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          REBUILD_REQUESTED=false
          for i in $(seq 1 20); do
            BUILD=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')
            STATUS=$(echo "$BUILD" | jq -r '.status // "unknown"')
            BUILT_SHA=$(echo "$BUILD" | jq -r '.commit // ""')
            echo "[$i/20] pages build: status=${STATUS} commit=${BUILT_SHA:0:7} (HEAD=${HEAD_SHA:0:7})"
            if [ "$STATUS" = "built" ] && [ "$BUILT_SHA" = "$HEAD_SHA" ]; then
              echo "[OK] Pages가 최신 커밋으로 배포됨"
              exit 0
            fi
            # errored는 즉시, 오래된 building/stale built는 2.5분 대기 후 1회만 재빌드 요청
            if [ "$REBUILD_REQUESTED" = "false" ] && { [ "$STATUS" = "errored" ] || [ "$i" -ge 5 ]; }; then
              echo "[RETRY] Pages 재빌드 요청 (status=${STATUS})"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
              REBUILD_REQUESTED=true
            fi
            sleep 30
          done
          echo "::error::Pages 배포가 10분 내 완료되지 않음 — Settings → Pages 수동 확인 필요"
          exit 1
