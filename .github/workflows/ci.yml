name: CI

on:
  pull_request:
    paths: ['scripts/**', 'tests/**', 'docs/_template.html', 'docs/_weekly_template.html', 'docs/_og_template.html', 'requirements*.txt', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'docs/_template.html', 'docs/_weekly_template.html', 'docs/_og_template.html', 'requirements*.txt', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: pytest -q
