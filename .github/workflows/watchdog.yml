name: News Watchdog

on:
  schedule:
    - cron: '0 2 * * *'   # 11:00 KST — 메인 워크플로우(09:30~10:30) 이후 체크
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Check if today already updated
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          ARCHIVE="docs/archive/${TODAY}.html"
          echo "today=${TODAY}" >> $GITHUB_OUTPUT
          if [ -f "$ARCHIVE" ] && grep -q 'class="entry"' "$ARCHIVE"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[OK] ${TODAY} 이미 갱신됨 — watchdog 종료"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "[WATCHDOG] ${TODAY} 갱신 없음 — 복구 실행"
          fi

      - name: Set up Python 3.11
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install requests python-dateutil

      - name: Fetch news and generate HTML
        if: steps.check.outputs.skip != 'true'
        env:
          NEWS_TOKEN: ${{ secrets.NEWS_GITHUB_TOKEN }}
        run: python scripts/fetch_and_generate.py

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || \
            git commit -m "chore: watchdog recovery $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
