name: News Watchdog

on:
  schedule:
    # 메인 워크플로우 3차(11:49 KST) 이후. 정각 회피 — daily-news-update.yml 주석 참고.
    - cron: '29 3 * * *'   # 12:29 KST — 메인 워크플로우(10:37~11:49) 이후 체크
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # 판정 불가 시 복구를 막지 않도록 — daily-news-update.yml의 동일 주석 참고.
      - name: Check if today already updated
        id: check
        continue-on-error: true
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          ARCHIVE="docs/archive/${TODAY}.html"
          echo "today=${TODAY}" >> $GITHUB_OUTPUT
          # daily-news-update.yml과 동일한 게이트 — 건수 + 한국어 AI 요약 커버리지
          # `|| true` 필수 — daily-news-update.yml의 동일 주석 참고.
          # 매칭 0건(아카이브 없음)이면 grep exit 1 → bash -e로 스텝이 죽어 복구가 안 된다.
          COV=$(grep -o 'name="ai-summary-coverage" content="[0-9]*/[0-9]*"' "$ARCHIVE" 2>/dev/null | head -1 | grep -o '[0-9]*/[0-9]*' || true)
          PCT=0
          if [ -n "$COV" ] && [ "${COV#*/}" -gt 0 ]; then
            PCT=$(( ${COV%/*} * 100 / ${COV#*/} ))
          fi
          # 폴백 섹션 판별 — daily-news-update.yml의 동일 주석 참고 (15/25 = 60% 경계 함정).
          FALLBACK=no
          grep -q 'col-count">[^<]*(' "$ARCHIVE" 2>/dev/null && FALLBACK=yes
          if [ -f "$ARCHIVE" ] && grep -q 'class="entry"' "$ARCHIVE" && ! grep -q 'col-count">0건' "$ARCHIVE" && [ "$PCT" -ge 60 ] && [ "$FALLBACK" = "no" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[OK] ${TODAY} 이미 갱신됨 (AI 요약 ${COV:-?} = ${PCT}%) — watchdog 종료"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "[WATCHDOG] ${TODAY} 갱신 없음 또는 미완성 (AI 요약 ${COV:-없음} = ${PCT}%, 폴백=${FALLBACK}) — 복구 실행"
          fi

      - name: Set up Python 3.11
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install requests python-dateutil

      - name: Fetch news and generate HTML
        if: steps.check.outputs.skip != 'true'
        env:
          NEWS_TOKEN: ${{ secrets.NEWS_GITHUB_TOKEN }}
        run: python scripts/fetch_and_generate.py

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || \
            git commit -m "chore: watchdog recovery $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      # 레포가 최신이어도(위 단계 skip) Pages 배포가 실패/고착됐으면 사이트는 옛날 상태다.
      # 최신 커밋이 실제 배포됐는지 확인하고 아니면 재빌드를 요청한다 (2026-07-03 장애 재발 방지).
      - name: Verify Pages deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          REBUILD_REQUESTED=false
          for i in $(seq 1 20); do
            BUILD=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')
            STATUS=$(echo "$BUILD" | jq -r '.status // "unknown"')
            BUILT_SHA=$(echo "$BUILD" | jq -r '.commit // ""')
            echo "[$i/20] pages build: status=${STATUS} commit=${BUILT_SHA:0:7} (HEAD=${HEAD_SHA:0:7})"
            if [ "$STATUS" = "built" ] && [ "$BUILT_SHA" = "$HEAD_SHA" ]; then
              echo "[OK] Pages가 최신 커밋으로 배포됨"
              exit 0
            fi
            # errored는 즉시, 오래된 building/stale built는 2.5분 대기 후 1회만 재빌드 요청
            if [ "$REBUILD_REQUESTED" = "false" ] && { [ "$STATUS" = "errored" ] || [ "$i" -ge 5 ]; }; then
              echo "[RETRY] Pages 재빌드 요청 (status=${STATUS})"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
              REBUILD_REQUESTED=true
            fi
            sleep 30
          done
          echo "::error::Pages 배포가 10분 내 완료되지 않음 — Settings → Pages 수동 확인 필요"
          exit 1
