<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Intelligence — {{CURRENT_DATE}}</title>
  <meta name="description" content="교육 뉴스, AI 논문, AI 기술 뉴스 일일 브리핑 — Daily Intelligence">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-signal" aria-hidden="true"></span>
        <span class="brand-name">Daily Intelligence</span>
      </div>
      <div class="header-right">
        <time class="header-date">{{CURRENT_DATE}}</time>
        <button class="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">
          <span class="theme-icon">◐</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="date-nav" aria-label="날짜 선택">
    {{DATE_NAV}}
  </nav>

  <main class="news-grid" id="main-content">

    <section class="news-col" data-cat="edu" aria-labelledby="col-edu-label">
      <div class="col-header">
        <span class="col-label" id="col-edu-label">교육 뉴스</span>
      </div>
      <div class="col-items" role="list">{{EDU_NEWS_CARDS}}</div>
    </section>

    <section class="news-col" data-cat="paper" aria-labelledby="col-paper-label">
      <div class="col-header">
        <span class="col-label" id="col-paper-label">AI 논문</span>
      </div>
      <div class="col-items" role="list">{{AI_PAPER_CARDS}}</div>
    </section>

    <section class="news-col" data-cat="tech" aria-labelledby="col-tech-label">
      <div class="col-header">
        <span class="col-label" id="col-tech-label">AI 기술</span>
      </div>
      <div class="col-items" role="list">{{AI_TECH_CARDS}}</div>
    </section>

  </main>

  <footer class="site-footer">
    <span class="footer-updated">갱신 <time datetime="{{LAST_UPDATED}}">{{LAST_UPDATED}}</time></span>
    <a class="footer-link" href="https://github.com/tigerjk9" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
