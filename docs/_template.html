<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Intelligence — {{CURRENT_DATE}}</title>
  <meta name="description" content="교육 뉴스, AI 논문, AI 기술 뉴스 일일 브리핑 — Daily Intelligence">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-filter="all">

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-signal" aria-hidden="true"></span>
        <span class="brand-name">Daily Intelligence</span>
        <span class="brand-tag" aria-hidden="true">EDU · PAPERS · TECH</span>
      </div>
      <div class="header-right">
        <time class="header-date">{{CURRENT_DATE}}</time>
        <button class="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환">
          <span class="theme-icon">◐</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="date-nav" aria-label="날짜 선택">
    <div class="date-nav-inner">
      {{DATE_NAV}}
    </div>
  </nav>

  <nav class="cat-filter" aria-label="카테고리 필터">
    <div class="cat-filter-inner">
      <button class="cat-chip active" type="button" data-filter="all">전체</button>
      <button class="cat-chip" type="button" data-filter="edu">교육</button>
      <button class="cat-chip" type="button" data-filter="paper">논문</button>
      <button class="cat-chip" type="button" data-filter="tech">기술</button>
    </div>
  </nav>

  <main class="news-grid" id="main-content">

    <section class="col" data-cat="edu" aria-labelledby="col-edu-title">
      <header class="col-head">
        <h2 class="col-title" id="col-edu-title">교육 뉴스</h2>
        <span class="col-count">{{EDU_NEWS_COUNT}}</span>
      </header>
      {{EDU_NEWS_CARDS}}
    </section>

    <section class="col" data-cat="paper" aria-labelledby="col-paper-title">
      <header class="col-head">
        <h2 class="col-title" id="col-paper-title">AI 논문</h2>
        <span class="col-count">{{AI_PAPER_COUNT}}</span>
      </header>
      {{AI_PAPER_CARDS}}
    </section>

    <section class="col" data-cat="tech" aria-labelledby="col-tech-title">
      <header class="col-head">
        <h2 class="col-title" id="col-tech-title">AI 기술</h2>
        <span class="col-count">{{AI_TECH_COUNT}}</span>
      </header>
      {{AI_TECH_CARDS}}
    </section>

  </main>

  <footer class="site-footer">
    <span class="footer-updated">갱신 <time datetime="{{LAST_UPDATED_ISO}}">{{LAST_UPDATED_KR}}</time></span>
    <a class="footer-link" href="https://github.com/tigerjk9" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
